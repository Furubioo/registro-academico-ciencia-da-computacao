name: Proteção de Cabeçalhos (.h)

on: [push]

jobs:
  check-headers:
    name: Validar Integridade dos Cabeçalhos
    if: github.actor != 'github-actions[bot]' && github.actor != 'github-classroom[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar arquivos .h ou pasta test modificados
        id: check
        run: |
          # Obtém a lista de arquivos modificados no push atual
          # Trata o caso de primeira push (quando github.event.before é zero)
          BEFORE_SHA=${{ github.event.before }}
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # Se for a primeira push, compara com o commit pai ou lista tudo
            MODIFIED_FILES=$(git ls-files | grep -E '\.h$|^test/' || true)
          else
            MODIFIED_FILES=$(git diff --name-only $BEFORE_SHA ${{ github.sha }} | grep -E '\.h$|^test/' || true)
          fi

          if [ -n "$MODIFIED_FILES" ]; then
            echo "modified=true" >> $GITHUB_OUTPUT
            echo "Arquivos protegidos detectados: $MODIFIED_FILES"
          else
            echo "modified=false" >> $GITHUB_OUTPUT
          fi

      - name: Notificar Infração no README
        if: steps.check.outputs.modified == 'true'
        run: |
          echo "Modificação indevida detectada. Atualizando README.md..."

          # Prepara o aviso formatado
          AVISO="> [!CAUTION]\n> # ⚠️ ATIVIDADE INVALIDADA\n>\n> Identificamos modificações indevidas em arquivos de cabeçalho (\`.h\`) ou na pasta de testes (\`test/\`).\n> Esta ação viola as regras da atividade e resultou na invalidação automática da submissão.\n>\n> **Data da detecção:** $(date +'%d/%m/%Y %H:%M:%S')\n\n---\n\n"

          # Insere o aviso no topo do README.md
          printf "$AVISO" > README.new
          cat README.md >> README.new
          mv README.new README.md

          # Configura e envia o commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "⚠️ Alerta: Modificação indevida detectada (arquivos .h ou pasta test) [BOT]"
          git push

          # Falha o workflow propositalmente
          echo "::error::Arquivos protegidos (.h ou pasta test) foram alterados. Atividade cancelada."
          exit 1
